- name: Setup k3s on control plane
  hosts: controlplane
  remote_user: root
  gather_facts: false
  tasks:
    - name: Wait for control plane to become reachable via SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Ensure fresh SSH host key in known_hosts
      delegate_to: localhost
      ansible.builtin.known_hosts:
        name: "{{ groups['controlplane'][0] }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' ~ groups['controlplane'][0]) }}"
        state: present

    - name: Download k3s script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: "~/install.sh"
        mode: 755

    - name: Install k3s script
      ansible.builtin.command: "~/install.sh"
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s API server port 6443 to be ready
      ansible.builtin.wait_for:
        port: 6443
        delay: 3
        timeout: 60

    - name: Wait for node-token to be generated
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Capture k3s.yaml
      ansible.builtin.fetch:
        src: "/etc/rancher/k3s/k3s.yaml"
        dest: ~/.kube/config
        flat: true

    - name: Update local kubeconfig
      delegate_to: localhost
      ansible.builtin.replace:
        path: "~/.kube/config"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ groups['controlplane'][0] }}:6443"
